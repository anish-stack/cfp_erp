# /etc/nginx/sites-available/api.centreforpilesandfistula.com
upstream cpf_api { server 127.0.0.1:5000; keepalive 32; }

server {
  listen 80;
  server_name api.centreforpilesandfistula.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.centreforpilesandfistula.com;
  ssl_certificate     /etc/letsencrypt/live/centreforpilesandfistula.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/centreforpilesandfistula.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 12m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://cpf_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
